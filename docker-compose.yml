services:
  # PostgreSQL Database with persistent volume
  db:
    image: postgres:15-alpine
    container_name: loansight_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loansight}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django REST Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: loansight_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata api/fixtures/mlmodels.json &&
             gunicorn loan_sight.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=loan_sight.settings
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

# React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: loansight_frontend
    command: npm run dev -- --host
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    stdin_open: true
    tty: true


volumes:
  postgres_data:
    driver: local